<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#141618" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <title>Beam</title>
</head>
<body>
  <header>
    <div class="brand"><span class="beam-mark" aria-hidden="true"><i></i><i></i><i></i></span><h1>Beam</h1></div>
    <span class="header-label">From PC</span>
  </header>
  <div id="setup" hidden>
    <label for="tokenInput">PC token</label>
    <input id="tokenInput" type="text" placeholder="Paste token from pairing screen" />
    <button id="saveTokenButton">Save</button>
    <p id="tokenError" hidden>Wrong token &mdash; check for typos and try again.</p>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="empty" hidden>No pending items.</p>
  <ul id="items"></ul>
  <script src="app.js?v=3"></script>
</body>
</html>
