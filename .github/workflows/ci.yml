name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Build and Backend Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Beam.sln
      - run: dotnet build Beam.sln --configuration Release --no-restore
      - run: dotnet test tests/Beam.Server.Tests/Beam.Server.Tests.csproj --configuration Release --no-build

  browser:
    name: Browser Tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: tests/Beam.Web.Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Beam.Web.Tests/package-lock.json
      - run: npm ci
      - run: dotnet build ../Beam.Web.Host/Beam.Web.Host.csproj --configuration Release
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm test
        env:
          BEAM_BROWSER: chromium
          BEAM_ENGINE: ${{ matrix.engine }}

  installer:
    name: Windows Startup and Installer
    runs-on: windows-latest
    env:
      BEAM_PACKAGE_VERSION: 0.1.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained installer payload
        shell: pwsh
        run: |
          dotnet publish src/Beam.App/Beam.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/installer-payload "-p:Version=$env:BEAM_PACKAGE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath packaging/START-HERE.txt -Destination artifacts/installer-payload
      - name: Verify optional startup behavior
        run: dotnet run --project tests/Beam.App.Smoke/Beam.App.Smoke.csproj --configuration Release -- --startup-only
      - name: Acquire verified installer compiler
        shell: pwsh
        run: |
          $beamCompiler = & ./scripts/Get-InnoSetup.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'beam-inno-6.7.3')
          "BEAM_ISCC=$beamCompiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify isolated install upgrade and uninstall
        shell: pwsh
        run: ./tests/Beam.Installer.Tests/Invoke-InstallerTests.ps1 -PublishDirectory artifacts/installer-payload -IsccPath $env:BEAM_ISCC -LogDirectory artifacts/installer-test-logs
      - name: Compile production installer defaults
        shell: pwsh
        run: ./scripts/Publish-BeamInstaller.ps1 -PublishDirectory artifacts/installer-payload -Version $env:BEAM_PACKAGE_VERSION -IsccPath $env:BEAM_ISCC -OutputDirectory artifacts/installer-ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Beam-installer-test-logs
          path: artifacts/installer-test-logs/
