name: Package Windows Alpha
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Beam.Server.Tests/Beam.Server.Tests.csproj --configuration Release
      - name: Publish self-contained Windows ZIP
        shell: pwsh
        run: ./scripts/Publish-Beam.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Beam-win-x64-alpha
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
