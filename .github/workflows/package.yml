name: Package Windows Alpha
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (new builds must not replace a released version)
        required: true
        type: string
        default: '0.1.0-alpha.3'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      BEAM_PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Beam.Server.Tests/Beam.Server.Tests.csproj --configuration Release
      - run: dotnet run --project tests/Beam.App.Smoke/Beam.App.Smoke.csproj --configuration Release -- --startup-only
      - name: Publish portable ZIP and installer
        shell: pwsh
        run: |
          ./scripts/Publish-Beam.ps1 -Version $env:BEAM_PACKAGE_VERSION
          $beamCompiler = & ./scripts/Get-InnoSetup.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'beam-inno-6.7.3')
          $beamPayload = Join-Path 'artifacts/release' "Beam-$env:BEAM_PACKAGE_VERSION-win-x64"
          ./scripts/Publish-BeamInstaller.ps1 -PublishDirectory $beamPayload -Version $env:BEAM_PACKAGE_VERSION -IsccPath $beamCompiler
      - uses: actions/upload-artifact@v4
        with:
          name: Beam-win-x64-${{ inputs.version }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*-Setup.exe
            artifacts/release/*.sha256
